services:
  frontend:
    image: llm-platform/frontend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      network: host
    container_name: llm-platform-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: always

  backend:
    image: llm-platform/backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      network: host
    container_name: llm-platform-backend
    ports:
      - "${API_PORT:-8100}:8100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - IS_CONTAINERIZED=true
      - GPU_AGENT_URL=http://host.docker.internal:${GPU_AGENT_PORT:-9100}
      - DATABASE_URL=postgresql+asyncpg://${PG_USER:-llmuser}:${PG_PASSWORD}@postgres:5432/${PG_DB:-llm_platform}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${PG_USER:-llmuser}:${PG_PASSWORD}@postgres:5432/${PG_DB:-llm_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery-worker:
    image: llm-platform/backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: llm-platform-celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-16}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - IS_CONTAINERIZED=true
      - DATABASE_URL=postgresql+asyncpg://${PG_USER:-llmuser}:${PG_PASSWORD}@postgres:5432/${PG_DB:-llm_platform}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${PG_USER:-llmuser}:${PG_PASSWORD}@postgres:5432/${PG_DB:-llm_platform}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: llm-platform-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-llm_platform}
      POSTGRES_USER: ${PG_USER:-llmuser}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-llmuser}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: llm-platform-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  pg_data:
  redis_data:
